name: 每日推送 · 章鱼 AI·全景分析

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间 = UTC+8：
    # 04:30 UTC = 12:30 午间简报，11:30 UTC = 19:30 晚间简报
    - cron: "30 4,11 * * *"
  workflow_dispatch: # 支持在 Actions 页面手动触发（github.io 静态托管下「立即运行一次」的替代方案）

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 执行推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 推送前「去 AI 味」闸门（Hallmark 静态规则，见 docs/hallmark_deai.md）：
          DEAI_MODE: polish
        run: python push_brief.py
        # 推送前闸门顺序：大盘新鲜度 → 敏感词快讯过滤 → 去 AI 味体检+改写 → 敏感词终检 → 推送。
        # 退出码 3 = 大盘数据非最新、已按规则跳过推送。job 会显示为失败，
        # 这是有意为之——便于第一时间发现行情接口异常，而不是把旧数据推给用户。
        # 退出码 4 = 内容未通过敏感词检测、已按规则跳过推送。
        # 退出码 5 = DEAI_STRICT=1 且去 AI 味改写后仍有未修复 Floor 命中（默认关闭）。
